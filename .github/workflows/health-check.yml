name: S3 Health Check

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 9am UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.dvc"
      - "scripts/verify_urls.py"
      - ".github/workflows/health-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check S3 dataset URLs
        run: python3 scripts/verify_urls.py

      - name: Open issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `S3 health check failed — ${new Date().toISOString().slice(0,10)}`;
            const body = `The weekly S3 health check detected one or more unreachable URLs.\n\nSee the [failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\nThe source bucket may have moved or had files removed.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["broken-link"],
            });
