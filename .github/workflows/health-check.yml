name: S3 Health Check

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 9am UTC
  workflow_dispatch:      # allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all S3 URLs
        run: |
          python3 << 'EOF'
          import os, sys, urllib.request

          dvc_dir = "data-products"
          failures = []

          for fname in sorted(os.listdir(dvc_dir)):
              if not fname.endswith(".dvc"):
                  continue
              with open(os.path.join(dvc_dir, fname)) as f:
                  content = f.read()
              # extract URL from deps.path
              for line in content.splitlines():
                  line = line.strip()
                  if line.startswith("path: https://"):
                      url = line.split("path: ", 1)[1]
                      try:
                          req = urllib.request.Request(url, method="HEAD",
                                headers={"User-Agent": "oioda-registry-healthcheck"})
                          with urllib.request.urlopen(req, timeout=15) as r:
                              status = r.status
                          symbol = "✓" if status == 200 else "✗"
                          print(f"  {symbol} {status}  {fname}")
                          if status != 200:
                              failures.append((fname, status))
                      except Exception as e:
                          print(f"  ✗ ERR  {fname}  ({e})")
                          failures.append((fname, str(e)))

          if failures:
              print(f"\n{len(failures)} file(s) failed:")
              for name, err in failures:
                  print(f"  {name}: {err}")
              sys.exit(1)
          else:
              print(f"\nAll URLs reachable.")
          EOF

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `S3 health check failed — ${new Date().toISOString().slice(0,10)}`;
            const body = `The weekly S3 health check detected one or more unreachable URLs.\n\nSee the [failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\nThe source bucket may have moved or had files removed.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["broken-link"],
            });
