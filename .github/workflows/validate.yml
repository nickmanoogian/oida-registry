name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mock-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          pip install --quiet ruff
          ruff check .

      - name: Typecheck
        run: |
          pip install --quiet mypy
          mypy scripts/ --ignore-missing-imports

      - name: Import cycle check
        run: python3 scripts/check_imports.py

      - name: Validate small tier against RULES.md
        run: python3 scripts/validate_mock_data.py --tier small

      - name: Error scenarios work on every file extension
        # Two scenarios write real PDFs (encrypted, and text-free). The rest need
        # nothing beyond the standard library.
        run: |
          pip install --quiet "fpdf2>=2.8"
          python3 scripts/test_error_scenarios.py

      - name: Edge case tier generates and validates
        run: |
          python3 scripts/generate_mock_metadata.py --tier small --edge-cases --out /tmp/small-edge
          python3 scripts/validate_mock_data.py --tier small --dir /tmp/small-edge

      - name: Broken load files carry the fault they claim
        run: |
          pip install --quiet "fpdf2>=2.8" python-docx openpyxl python-pptx
          python3 scripts/build_load_package.py --tier small --no-oida --limit 60 --out /tmp/pkg
          python3 scripts/build_broken_load_files.py --package /tmp/pkg --out /tmp/broken
          python3 scripts/build_broken_load_files.py --package /tmp/pkg --out /tmp/broken --verify

      - name: Regenerate small tier and check determinism
        run: |
          python3 scripts/generate_mock_metadata.py --tier small
          if ! git diff --exit-code mock-data/small/; then
            echo "::error::Regenerating the small tier produced a diff against the committed files."
            echo "Either the generator changed without regenerating mock-data/small/, or generation is non-deterministic."
            echo "Run 'make mock-regen-small' and commit the result."
            exit 1
          fi
